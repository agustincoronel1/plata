services:
  db:
    # pgvector/pgvector trae la extensión `vector` (RAG) sobre PostgreSQL 17.
    image: pgvector/pgvector:pg17
    container_name: plata-db
    env_file:
      - ./backend/.env
    ports:
      - "5432:5432"
    volumes:
      - plata_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  plata_postgres_data:
